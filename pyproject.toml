[project]
name = "textutils"
version = "0.1.0"
description = "Small text utilities: tokenize, clean, and count word frequencies."
readme = "README.md"
authors = [
    { name = "Mihir Kansal", email = "mihirkansal7@gmail.com" }
]
requires-python = ">=3.15"
dependencies = []

[project.scripts]
textutils = "textutils:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "ruff>=0.17.4",
]

[tool.mypy]
strict = true
